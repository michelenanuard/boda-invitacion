<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boda de Ana Kary y Marcos</title>
  </head>
  <body>
    <form name="rsvp" data-netlify="true" method="POST" hidden>
      <input type="hidden" name="form-name" value="rsvp" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="attending" />
      <input type="number" name="guests" />
      <textarea name="message"></textarea>
    </form>
    <div id="root">
      <div class="app-loading" role="status" aria-live="polite">
        <div class="app-loading__monogram">A <span>&amp;</span> M</div>
        <p>Preparando la invitación…</p>
      </div>
    </div>
    <style>
      .app-loading{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:18px;background:#fbf6ec;color:#211b17;font-family:Georgia,serif;text-align:center}.app-loading__monogram{display:grid;place-items:center;width:72px;height:72px;border:1px solid rgba(184,138,67,.45);color:#b88a43;font-size:20px}.app-loading__monogram span{font-size:13px;line-height:0}.app-loading p{margin:0;color:#6f655d;font-size:16px}
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
