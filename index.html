<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boda de Ana Kary y Marcos</title>
    <meta
      name="description"
      content="Acompáñanos a celebrar la boda de Ana Kary y Marcos el 30 de agosto de 2026."
    />

    <!-- Vista previa al compartir en WhatsApp, Facebook y otras aplicaciones -->
    <link rel="canonical" href="https://anakary-marcos.netlify.app/" />
    <meta property="og:locale" content="es_DO" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Boda de Ana Kary y Marcos" />
    <meta property="og:title" content="Boda de Ana Kary y Marcos" />
    <meta
      property="og:description"
      content="Acompáñanos a celebrar nuestro gran día el 30 de agosto de 2026."
    />
    <meta property="og:url" content="https://anakary-marcos.netlify.app/" />
    <meta
      property="og:image"
      content="https://anakary-marcos.netlify.app/wedding-images/hero.jpg"
    />
    <meta
      property="og:image:secure_url"
      content="https://anakary-marcos.netlify.app/wedding-images/hero.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1067" />
    <meta property="og:image:height" content="1600" />
    <meta property="og:image:alt" content="Ana Kary y Marcos" />

    <!-- Compatibilidad con X/Twitter y clientes que leen Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Boda de Ana Kary y Marcos" />
    <meta
      name="twitter:description"
      content="Acompáñanos a celebrar nuestro gran día el 30 de agosto de 2026."
    />
    <meta
      name="twitter:image"
      content="https://anakary-marcos.netlify.app/wedding-images/hero.jpg"
    />
    <meta name="twitter:image:alt" content="Ana Kary y Marcos" />
  </head>
  <body>
    <form name="rsvp" data-netlify="true" method="POST" hidden>
      <input type="hidden" name="form-name" value="rsvp" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="attending" />
      <input type="number" name="guests" />
      <textarea name="message"></textarea>
    </form>
    <div id="root">
      <div class="app-loading" role="status" aria-live="polite">
        <div class="app-loading__monogram">A <span>&amp;</span> M</div>
        <p>Preparando la invitación…</p>
      </div>
    </div>
    <style>
      .app-loading{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:18px;background:#fbf6ec;color:#211b17;font-family:Georgia,serif;text-align:center}.app-loading__monogram{display:grid;place-items:center;width:72px;height:72px;border:1px solid rgba(184,138,67,.45);color:#b88a43;font-size:20px}.app-loading__monogram span{font-size:13px;line-height:0}.app-loading p{margin:0;color:#6f655d;font-size:16px}
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
